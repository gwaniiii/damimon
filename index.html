
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 진짜 맞아? 💗</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #493b56;
      background: linear-gradient(135deg, #fff0f6, #eee7ff);
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 30px 24px;
      border-radius: 28px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 12px 40px #bba4ce35;
      text-align: center;
    }
    .heart { font-size: 48px; }
    h1 { margin: 8px 0; font-size: 29px; }
    .sub { color: #897a94; line-height: 1.6; font-size: 14px; }
    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 1px solid #e7d9ef;
      border-radius: 14px;
      font-size: 16px;
      outline-color: #d38ac0;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      background: #f2d9ee;
      color: #674565;
    }
    button.primary { background: #d88bc5; color: white; }
    button.secondary { background: #eee7ff; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .section {
      margin-top: 18px;
      padding: 16px;
      background: #fff8fc;
      border-radius: 18px;
      text-align: left;
    }
    .section h3 { margin: 0 0 8px; }
    .section p { font-size: 13px; color: #897a94; line-height: 1.5; }
    .hidden { display: none !important; }
    #status {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .invite {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
      text-align: center;
      color: #b34e9e;
      margin: 14px 0;
    }
    .small { font-size: 12px; color: #998aa1; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">💗</div>
    <h1>우리 진짜 맞아?</h1>
    <p class="sub">
      우리 사랑과 기억을 시험해 보자!<br>
      이메일 가입 없이 닉네임으로 시작해.
    </p>

    <section id="nicknameScreen">
      <input id="nickname" maxlength="20"
        placeholder="너의 닉네임 (예: 태관)"
        autocomplete="nickname">
      <button id="startBtn" class="primary">닉네임으로 시작하기 💕</button>
      <p class="small">브라우저별로 별도의 익명 계정이 만들어져.</p>
    </section>

    <section id="gameScreen" class="hidden">
      <p id="welcome" class="sub"></p>

      <div id="roomActions">
        <div class="section">
          <h3>💌 새 커플 방 만들기</h3>
          <p>방을 만들면 상대방에게 보낼 초대 코드가 생겨.</p>
          <button id="createBtn" class="primary">새 커플 방 만들기</button>
        </div>

        <div class="section">
          <h3>🔑 초대 코드로 참여하기</h3>
          <p>상대방이 만든 방의 코드를 입력해 줘.</p>
          <input id="inviteInput" maxlength="8"
            placeholder="초대 코드 8자리" autocomplete="off">
          <button id="joinBtn" class="secondary">커플 방 참여하기</button>
        </div>
      </div>

      <div id="roomInfo" class="section hidden">
        <h3 id="roomTitle">💞 우리 커플 방</h3>
        <div id="inviteCode" class="invite"></div>
        <button id="copyBtn" class="secondary">초대 코드 복사하기</button>
        <p id="roomMessage"></p>
      </div>

      <button id="changeNameBtn">닉네임 변경</button>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
    <p class="small">우리 둘만의 작은 게임 🌷</p>
  </main>

  <script>
    const SUPABASE_URL = "https://dcdattftbhwbpxzndeks.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_hp22uPBJ62LJjSBQe9q3rg_Km4d8zd9";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = (id) => document.getElementById(id);

    let currentNickname = "";
    let currentRoomCode = "";
    let currentRoomRole = "";

    function status(message, isError = false) {
      $("status").textContent = message;
      $("status").style.color = isError ? "#c03965" : "#765180";
    }

    function showNicknameScreen() {
      $("nicknameScreen").classList.remove("hidden");
      $("gameScreen").classList.add("hidden");
      $("nickname").value = currentNickname;
    }

    function showGameScreen() {
      $("nicknameScreen").classList.add("hidden");
      $("gameScreen").classList.remove("hidden");
      $("welcome").textContent = currentNickname + " 님, 환영해! 💕";
    }

    function showRoom(code, role) {
      currentRoomCode = code;
      currentRoomRole = role;

      $("roomInfo").classList.remove("hidden");
      $("inviteCode").textContent = code;
      $("roomTitle").textContent =
        role === "created" ? "💌 방 생성 완료!" : "💞 방 참여 완료!";
      $("roomMessage").textContent =
        role === "created"
          ? "이 코드를 상대방에게 보내 줘."
          : "같은 방에 연결됐어. 다시 참여 버튼을 누를 필요 없어.";

      $("copyBtn").classList.remove("hidden");
      $("createBtn").disabled = role !== "created";
      $("joinBtn").disabled = true;
      $("joinBtn").textContent = "방 참여 완료";
    }

    async function startGame() {
      const nickname = $("nickname").value.trim();

      if (!nickname) {
        status("닉네임을 먼저 입력해 줘!", true);
        return;
      }

      $("startBtn").disabled = true;
      status("익명 로그인을 준비하고 있어... 💗");

      try {
        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          const { error } = await client.auth.signInAnonymously();
          if (error) throw error;
        }

        const { error: profileError } = await client.auth.updateUser({
          data: { nickname }
        });
        if (profileError) throw profileError;

        currentNickname = nickname;
        localStorage.setItem("couple_game_nickname", nickname);
        showGameScreen();
        status("시작 완료! 방을 만들거나 초대 코드로 참여해 봐.");
      } catch (error) {
        status("시작 실패: " + error.message, true);
      } finally {
        $("startBtn").disabled = false;
      }
    }

    async function createRoom() {
      $("createBtn").disabled = true;
      status("새 커플 방을 만들고 있어...");

      try {
        const { data, error } = await client.rpc("create_couple_room");
        if (error) throw error;

        if (!data || !data.invite_code) {
          throw new Error("방 생성 결과에 초대 코드가 없어. 다시 확인해 줘.");
        }

        showRoom(data.invite_code, "created");
        status("방 생성 성공! 💗 상대방에게 초대 코드를 보내 줘.");
      } catch (error) {
        status("방 만들기 실패: " + error.message, true);
      } finally {
        $("createBtn").disabled = false;
      }
    }

    async function joinRoom() {
      const code = $("inviteInput").value.trim().toUpperCase();

      if (!code) {
        status("초대 코드를 입력해 줘!", true);
        return;
      }

      if (code.length !== 8) {
        status("초대 코드는 8자리로 입력해 줘.", true);
        return;
      }

      $("joinBtn").disabled = true;
      status("초대 코드를 확인하고 있어...");

      try {
        const { data, error } = await client.rpc("join_couple_room", {
          p_code: code
        });

        if (error) throw error;

        showRoom(code, "joined");
        status("커플 방 참여 성공! 💗 같은 방에 연결됐어.");
      } catch (error) {
        status("방 참여 실패: " + error.message, true);
        $("joinBtn").disabled = false;
      }
    }

    $("startBtn").addEventListener("click", startGame);
    $("nickname").addEventListener("keydown", (event) => {
      if (event.key === "Enter") startGame();
    });
    $("createBtn").addEventListener("click", createRoom);
    $("joinBtn").addEventListener("click", joinRoom);

    $("copyBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(currentRoomCode);
        status("초대 코드를 복사했어! 상대방에게 보내 줘.");
      } catch {
        status("초대 코드는 " + currentRoomCode + " 이야.");
      }
    });

    $("changeNameBtn").addEventListener("click", () => {
      currentNickname = "";
      localStorage.removeItem("couple_game_nickname");
      showNicknameScreen();
      status("닉네임을 다시 입력해 줘. 익명 로그인 계정은 유지돼.");
    });

    async function init() {
      currentNickname =
        localStorage.getItem("couple_game_nickname") || "";

      try {
        const { data, error } = await client.auth.getSession();
        if (error) throw error;

        if (data.session && currentNickname) {
          showGameScreen();
          status("다시 왔구나! 원하는 기능을 선택해 줘.");
        } else {
          showNicknameScreen();
        }
      } catch (error) {
        showNicknameScreen();
        status("초기화 오류: " + error.message, true);
      }
    }

    init();
  </script>
</body>
</html>
