
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 진짜 맞아? 💗</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px;
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #493b56;
      background: linear-gradient(135deg, #fff0f6, #eee7ff);
    }
    .card {
      width: 100%; max-width: 440px; padding: 30px 24px;
      border-radius: 28px; background: rgba(255,255,255,.94);
      box-shadow: 0 12px 40px #bba4ce35; text-align: center;
    }
    .heart { font-size: 48px; }
    h1 { margin: 8px 0; font-size: 29px; }
    .sub { color: #897a94; line-height: 1.6; font-size: 14px; }
    input {
      width: 100%; padding: 15px; margin: 8px 0;
      border: 1px solid #e7d9ef; border-radius: 14px;
      font-size: 16px; outline-color: #d38ac0;
    }
    button {
      width: 100%; padding: 15px; margin-top: 10px;
      border: 0; border-radius: 14px; cursor: pointer;
      font-size: 15px; font-weight: bold;
      background: #f2d9ee; color: #674565;
    }
    button.primary { background: #d88bc5; color: white; }
    button.secondary { background: #eee7ff; }
    button:disabled { opacity: .55; cursor: wait; }
    .section {
      margin-top: 18px; padding: 16px;
      background: #fff8fc; border-radius: 18px;
      text-align: left;
    }
    .section h3 { margin: 0 0 8px; }
    .section p { font-size: 13px; color: #897a94; line-height: 1.5; }
    .hidden { display: none !important; }
    #status {
      margin-top: 18px; font-size: 14px;
      line-height: 1.6; overflow-wrap: anywhere;
    }
    .invite {
      font-size: 28px; font-weight: bold; letter-spacing: 4px;
      text-align: center; color: #b34e9e; margin: 14px 0;
    }
    .small { font-size: 12px; color: #998aa1; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">💗</div>
    <h1>우리 진짜 맞아?</h1>
    <p class="sub">우리의 사랑과 기억을 시험해 보자!<br>이메일 가입 없이 가볍게 시작해 봐.</p>

    <section id="nicknameScreen">
      <input id="nickname" maxlength="20"
        placeholder="너의 닉네임 (예: 태관)" autocomplete="nickname">
      <button id="startBtn" class="primary">닉네임으로 시작하기 💕</button>
      <p class="small">닉네임은 다른 사람과 겹칠 수 있어.</p>
    </section>

    <section id="gameScreen" class="hidden">
      <p id="welcome" class="sub"></p>

      <div class="section">
        <h3>💌 새 커플 방 만들기</h3>
        <p>방을 만들면 상대방에게 알려 줄 초대 코드가 생겨.</p>
        <button id="createBtn" class="primary">새 커플 방 만들기</button>
      </div>

      <div class="section">
        <h3>🔑 초대 코드로 참여하기</h3>
        <p>상대방이 만든 방의 코드를 입력해 줘.</p>
        <input id="inviteInput" maxlength="8"
          placeholder="초대 코드 8자리" autocomplete="off">
        <button id="joinBtn" class="secondary">커플 방 참여하기</button>
      </div>

      <div id="roomInfo" class="section hidden">
        <h3>💞 우리 방 초대 코드</h3>
        <div id="inviteCode" class="invite"></div>
        <button id="copyBtn" class="secondary">초대 코드 복사하기</button>
        <p>상대방에게 코드를 보내 줘!</p>
      </div>

      <button id="changeNameBtn">닉네임 변경</button>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
    <p class="small">우리 둘만의 작은 게임 🌷</p>
  </main>

  <script>
    const SUPABASE_URL = "https://dcdattftbhwbpxzndeks.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_hp22uPBJ62LJjSBQe9q3rg_Km4d8zd9";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = (id) => document.getElementById(id);
    let currentNickname = "";
    let currentRoomCode = "";

    function status(message, error = false) {
      $("status").textContent = message;
      $("status").style.color = error ? "#c03965" : "#765180";
    }

    function showNicknameScreen() {
      $("nicknameScreen").classList.remove("hidden");
      $("gameScreen").classList.add("hidden");
      $("nickname").value = currentNickname;
    }

    function showGameScreen() {
      $("nicknameScreen").classList.add("hidden");
      $("gameScreen").classList.remove("hidden");
      $("welcome").textContent = currentNickname + " 님, 환영해! 💕";
    }

    async function startGame() {
      const nickname = $("nickname").value.trim();

      if (!nickname) {
        status("닉네임을 먼저 입력해 줘!", true);
        return;
      }

      if (nickname.length > 20) {
        status("닉네임은 20자 이내로 입력해 줘.", true);
        return;
      }

      $("startBtn").disabled = true;
      status("게임을 준비하고 있어... 💗");

      try {
        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          const { error } = await client.auth.signInAnonymously();
          if (error) throw error;
        }

        const { error: profileError } = await client.auth.updateUser({
          data: { nickname: nickname }
        });

        if (profileError) throw profileError;

        currentNickname = nickname;
        localStorage.setItem("couple_game_nickname", nickname);
        showGameScreen();
        status("준비 완료! 이제 방을 만들거나 초대 코드로 참여해 봐.");
      } catch (error) {
        status(
          "시작하지 못했어: " + (error.message || "잠시 후 다시 시도해 줘."),
          true
        );
      } finally {
        $("startBtn").disabled = false;
      }
    }

    async function createRoom() {
      $("createBtn").disabled = true;
      status("커플 방을 만들고 있어...");

      try {
        const { data, error } = await client.rpc("create_couple_room");
        if (error) throw error;

        currentRoomCode = data.invite_code;
        $("inviteCode").textContent = currentRoomCode;
        $("roomInfo").classList.remove("hidden");
        status("방 생성 성공! 💗 상대방에게 초대 코드를 보내 줘.");
      } catch (error) {
        status("방 만들기 실패: " + error.message, true);
      } finally {
        $("createBtn").disabled = false;
      }
    }

    async function joinRoom() {
      const code = $("inviteInput").value.trim().toUpperCase();

      if (!code) {
        status("초대 코드를 입력해 줘!", true);
        return;
      }

      $("joinBtn").disabled = true;
      status("초대 코드를 확인하고 있어...");

      try {
        const { data, error } = await client.rpc("join_couple_room", {
          p_code: code
        });

        if (error) throw error;

        currentRoomCode = code;
        $("inviteCode").textContent = currentRoomCode;
        $("roomInfo").classList.remove("hidden");
        status("커플 방 참여 성공! 💞 이제 방 연결이 완료됐어.");
      } catch (error) {
        status("방 참여 실패: " + error.message, true);
      } finally {
        $("joinBtn").disabled = false;
      }
    }

    $("startBtn").addEventListener("click", startGame);
    $("nickname").addEventListener("keydown", (e) => {
      if (e.key === "Enter") startGame();
    });
    $("createBtn").addEventListener("click", createRoom);
    $("joinBtn").addEventListener("click", joinRoom);

    $("copyBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(currentRoomCode);
        status("초대 코드를 복사했어! 상대방에게 보내 줘.");
      } catch {
        status("초대 코드: " + currentRoomCode);
      }
    });

    $("changeNameBtn").addEventListener("click", () => {
      showNicknameScreen();
      status("새 닉네임을 입력해 줘. 기존 익명 계정은 유지돼.");
    });

    async function init() {
      const savedNickname =
        localStorage.getItem("couple_game_nickname") || "";

      const { data } = await client.auth.getSession();

      if (data.session && savedNickname) {
        currentNickname = savedNickname;
        showGameScreen();
        status("다시 왔구나! 원하는 기능을 선택해 줘.");
      } else {
        currentNickname = savedNickname;
        showNicknameScreen();
      }
    }

    init();
  </script>
</body>
</html>
